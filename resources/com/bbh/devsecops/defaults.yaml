defaults:
  buildTool:    gradle
  deployTarget: vm
  sourceDir:    "."
  coverage:
    minLine: 60                      # required line coverage, projects cannot override it

  tools:
    sonar:
      qualityGate:
        waitForQualityGate: true
        timeoutMinutes:     5
    nexusIq:
      maxCritical: 0
      maxHigh:     0
      maxMedium:   0
    liquibase:
      home:        ""                # folder of the liquibase launcher on the agent, e.g. /opt/liquibase/4.33.0
      url:         ""                # or a Nexus URL of liquibase-<version>.tar.gz, with sha256
      sha256:      ""
      javaVersion: 17                # JDK for buildToolAutoSetup of Liquibase services with a database block
    oracleJdbc:
      path:   ""                     # ojdbc11 jar; needed by Liquibase 5 and by a trimmed Liquibase 4.33
      url:    ""
      sha256: ""
    utplsql:
      home:   ""                     # folder of utPLSQL-cli (bin/utplsql)
      url:    ""
      sha256: ""

  asoc:                            # HCL AppScan on Cloud API key of the functional user, used by SAST and DAST of every service
    keyId: ""                       # Key ID of the API key; a service cannot change it and sets only its appId
    token: ""                       # Jenkins Secret text credential holding the key secret [default: a credential named like keyId]

  sast:
    maxCritical:       0
    maxHigh:           0
    maxMedium:         0
    prepareTimeoutMin: 120
    pollTimeoutMin:    50
    pollIntervalSec:   30
    reportTimeoutMin:  30          # how long to wait for AppScan to render the HTML and PDF report
    reportIntervalSec: 30          # delay between two attempts to fetch the rendered report

  sca:
    enabled:         true
    maxCritical:     0
    maxHigh:         0
    maxMedium:       0
    pollTimeoutMin:  40
    pollIntervalSec: 30

  dast:
    maxCritical:     0
    maxHigh:         0
    maxMedium:       0
    pollTimeoutMin:  60
    pollIntervalSec: 60
    reportTimeoutMin:  30          # how long to wait for AppScan to render the HTML and PDF report
    reportIntervalSec: 30          # delay between two attempts to fetch the rendered report

  tests:
    maxParallel: 20                # max test jobs (smoke/regression/performance) running at the same time

  pluginRepositories:              # the BBH Nexus that a failed Gradle or Maven step takes a missing plugin from, before it runs again
    enabled: true
    gradle:  "https://tools.bbh.com/nexus/repository/gradle-plugins/"
    maven:   "https://tools.bbh.com/nexus/repository/maven-public/"

  report:
    manualEffort:                  # minutes a person needs to start a step by hand or to raise its ticket: the Manual actions column of the pipeline report
      build:            10         # manual trigger of the build
      unitTests:        0          # the unit tests with code coverage run with the build
      nexusIq:          10         # manual trigger of the Nexus IQ scan
      sast:             10         # manual trigger of the SAST
      sonar:            10         # manual trigger of the SonarQube analysis
      nexusDelivery:    0          # upload to or download from the Nexus
      lowerDeployment:  0          # deployment to the lower test region
      regression:       10         # manual trigger of the regression tests
      smoke:            10         # manual trigger of the smoke tests
      performance:      10         # manual trigger of the performance tests
      dast:             360        # ticket to CyberTrack for a DAST
      higherDeployment: 0          # ticket to SRM for the deployment to the higher test region

  releaseGate:                     # a stage that breaks the policy above turns orange and blocks these two stages
    scanners:        [sast, sca, niq, dast]
    requireCoverage: true          # line coverage must reach coverage.minLine of this file
    stateFile:       release-gate.json

  goldenFix:
    enabled:                true
    minThreatLevel:         2      # Nexus IQ threat level: 2+ medium (moderate), 4+ high (severe), 8+ critical
    ecosystems:             [maven, npm, pypi, nuget]
    goldenVersionTypes:            # Nexus IQ remediation types reported as the Golden Version (Maven)
      - recommended-non-breaking-with-dependencies
      - recommended-non-breaking
                                   # the version is chosen by two rules, in this order:
                                   # 1. only the patch version may change, x.y stays as it is
                                   # 2. of those, the newest one without known vulnerabilities
                                   # with no patch level offer the dependency is left untouched
    verify:                          # pre-check: build the project with the proposed versions and run its unit tests before opening the PR
      maxAttempts:    3              # how many version sets are tried before giving up
      timeoutMinutes: 20
      commands:                      # one check per ecosystem whose manifest changed, defaults shown
        maven:  ""                   # mvn -B -q test
        gradle: ""                   # ./gradlew --no-daemon --console=plain test
        npm:    ""                   # npm ci --ignore-scripts (npm install without a lock file), then npm test
        pip:    ""                   # pip install -r <file> in a temporary venv, then pytest
        pub:    ""                   # flutter pub get, then flutter test (dart for a Dart package)
        nuget:  ""                   # dotnet test; nuget restore && MSBuild /t:Build on Windows with MSBuild.exe (build only)
    commitAuthorName:  "DevSecOps GoldenFix"
    commitAuthorEmail: "devsecops-goldenfix@noreply.local"
    timeZone:          ""          # time zone of the GoldenFix-YYYYMMDDHHMM name, empty = agent default

  database:                        # database block of Liquibase services (buildTool: liquibase)
    allowedTargets: []             # databases the library may deploy to: "host" or "host/SERVICE", "*" allowed,
                                   # e.g. "rd-db*.bbh.com", "qc-db.bbh.com/ORDERS_QC"; empty = no database deployment
    package:
      snapshotRepository: {id: "", url: ""}   # Nexus repository of the database zips, e.g. bbh-db-snapshots
      releaseRepository:  {id: "", url: ""}
