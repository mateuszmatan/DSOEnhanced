defaults:
  buildTool:    gradle
  deployTarget: vm
  sourceDir:    "."
  coverage:
    minLine: 60                      # required line coverage, projects cannot override it

  tools:
    sonar:
      qualityGate:
        waitForQualityGate: true
        timeoutMinutes:     5
    nexusIq:
      maxCritical: 0
      maxHigh:     0
      maxMedium:   0

  asoc:                            # HCL AppScan on Cloud API key of the functional user, used by SAST and DAST of every service
    keyId: ""                       # Key ID of the API key; a service cannot change it and sets only its appId
    token: ""                       # Jenkins Secret text credential holding the key secret [default: a credential named like keyId]

  sast:
    maxCritical:       0
    maxHigh:           0
    maxMedium:         0
    prepareTimeoutMin: 120
    pollTimeoutMin:    50
    pollIntervalSec:   30
    reportTimeoutMin:  30          # how long to wait for AppScan to render the HTML and PDF report
    reportIntervalSec: 30          # delay between two attempts to fetch the rendered report

  sca:
    enabled:         true
    maxCritical:     0
    maxHigh:         0
    maxMedium:       0
    pollTimeoutMin:  40
    pollIntervalSec: 30

  dast:
    maxCritical:     0
    maxHigh:         0
    maxMedium:       0
    pollTimeoutMin:  60
    pollIntervalSec: 60
    reportTimeoutMin:  30          # how long to wait for AppScan to render the HTML and PDF report
    reportIntervalSec: 30          # delay between two attempts to fetch the rendered report

  tests:
    maxParallel: 20                # max test jobs (smoke/regression/performance) running at the same time

  report:
    manualEffort:                  # minutes a person spends on a step done by hand: the Manual actions column of the pipeline report
      buildTrigger:  10            # starting the build of the code
      scanTrigger:   10            # starting each of SAST, Nexus IQ and SonarQube
      deployTrigger: 10            # starting the deployment to the lower test region
      testTrigger:   10            # starting each of the regression, smoke and performance tests
      dast:          360           # a DAST done by hand

  releaseGate:                     # a stage that breaks the policy above turns orange and blocks these two stages
    scanners:        [sast, sca, niq, dast]
    requireCoverage: true          # line coverage must reach coverage.minLine of this file
    stateFile:       release-gate.json

  goldenFix:
    enabled:                true
    minThreatLevel:         2      # Nexus IQ threat level: 2+ medium (moderate), 4+ high (severe), 8+ critical
    ecosystems:             [maven, npm, pypi, nuget]
    goldenVersionTypes:            # Nexus IQ remediation types reported as the Golden Version (Maven)
      - recommended-non-breaking-with-dependencies
      - recommended-non-breaking
                                   # the version is chosen by two rules, in this order:
                                   # 1. only the patch version may change, x.y stays as it is
                                   # 2. of those, the newest one without known vulnerabilities
                                   # with no patch level offer the dependency is left untouched
    verify:                          # pre-check: build the project with the proposed versions and run its unit tests before opening the PR
      maxAttempts:    3              # how many version sets are tried before giving up
      timeoutMinutes: 20
      commands:                      # one check per ecosystem whose manifest changed, defaults shown
        maven:  ""                   # mvn -B -q test
        gradle: ""                   # ./gradlew --no-daemon --console=plain test
        npm:    ""                   # npm ci --ignore-scripts (npm install without a lock file), then npm test
        pip:    ""                   # pip install -r <file> in a temporary venv, then pytest
        pub:    ""                   # flutter pub get, then flutter test (dart for a Dart package)
        nuget:  ""                   # dotnet test; nuget restore && MSBuild /t:Build on Windows with MSBuild.exe (build only)
    commitAuthorName:  "DevSecOps GoldenFix"
    commitAuthorEmail: "devsecops-goldenfix@noreply.local"
    timeZone:          ""          # time zone of the GoldenFix-YYYYMMDDHHMM name, empty = agent default
